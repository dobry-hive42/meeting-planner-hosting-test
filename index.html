function renderList(){

function renderPoll(p){
  if(!p)return `<p>Poll not found.</p>`;

  const tab=(v,l)=>`<button type="button" data-act="tab" data-v="${v}" aria-pressed="${orgTab===v}">${l}</button>`;
  let h=`<div class="stack"><div><button class="linkbtn" data-act="go-list">← All polls</button></div>`;
  if(orgTab==="results")h+=renderOrgBar(p);
  h+=`<div class="tabbar"><div class="seg" role="group" aria-label="What you see">${tab("results","Results")}${tab("mine","My vote")}${tab("preview","Preview as…")}</div></div>`;
  if(orgTab==="results"){
    h+=pollInfo(p,false);
    if(p.closed&&p.final)h+=finalBanner(p);
    h+=renderGroupCalendar(p)+renderRanking(p)+renderPeople(p)+renderOrgTools(p);
  }else if(orgTab==="mine"&&LIVE&&!p.invitees.includes(S.organizer)){
    h+=`<div class="banner info"><b>To vote yourself, join like everyone else.</b><p class="small">Use your own name and e-mail. Your answers then count the same as anyone's.</p></div>`+(p.closed?"":renderJoin(p));
  }else if(orgTab==="mine"){
    h+=`<div class="banner info"><b>Voting as ${esc(nameOf(S.organizer))}, like everyone else.</b><p class="small">Your answers count the same as anyone's. Organiser actions are under Results.</p><div><button class="btn small" data-act="tab" data-v="results">Back to managing</button></div></div>`;
    h+=renderVoter(p);
  }else if(!previewAs){
    h+=`<section class="card" aria-labelledby="pv-h"><h2 id="pv-h">Preview as…</h2><p class="small muted">See “${esc(p.title)}” exactly as this person sees it. Nothing you tap in the preview is saved.</p><div class="people">`;
    sortedInvitees(p).filter(x=>x!==S.organizer).forEach(x=>{const tags=[role(p,x)!=="reg"?ROLE_LBL[role(p,x)]:"",p.submitted[x]?"":"No answer yet",nudges(p,x).length?"Has a nudge waiting":""].filter(Boolean);
      h+=`<div class="prow" style="flex-wrap:nowrap"><span style="min-width:0">${esc(nameOf(x))} ${tags.map(t=>`<span class="tag">${t}</span>`).join(" ")}</span><button class="btn small" style="flex-shrink:0" data-act="preview-as" data-v="${x}" aria-label="Preview as ${esc(nameOf(x))}">Preview</button></div>`});
    h+=`</div></section>`;
  }else{
    h+=`<div class="previewbar" role="status"><span>Previewing as <b>${esc(nameOf(previewAs))}</b>. Nothing you tap here is saved.</span><span class="row"><button class="btn small" data-act="tab" data-v="preview">Other person</button><button class="btn small" data-act="tab" data-v="results">Back to managing</button></span></div>`;
    h+=renderVoter(p);
  }
  return h+`</div>`;
}
function renderOrgBar(p){
  const st=p.closed?"Voting closed":p.status==="draft"?"Draft · not sent":(LIVE?"Open · closes ":"Sent · closes ")+fmtDay(p.deadline);
  return `<section class="card" id="org-bar" aria-label="Manage this poll"><div class="between"><h1>${esc(p.title)}</h1><span class="tag">${st}</span></div>

    ${sendOpen&&p.status==="draft"?renderSendPanel(p):""}${LIVE?liveShareBox(p):""}</section>`;
}
function pollInfo(p,withTitle){const resp=responded(p).length;
  return `<div class="stack" style="gap:8px">${withTitle?`<span class="eyebrow">${p.mode==="list"?"Round 2 · run-off":"Find a date"} · organised by ${esc(nameOf(S.organizer))}</span>
    <h1>${esc(p.title)}</h1>`:""}${p.note?`<div>${md(p.note)}</div>`:""}${p.map?`<p><a href="${esc(p.map)}" target="_blank" rel="noopener">Open the place on a map</a></p>`:""}
    <div class="row small"><span class="tag">${resp} of ${p.invitees.length} answered</span><span class="tag">${p.closed?"Voting closed":"Voting closes "+fmtDay(p.deadline)}</span><span class="tag">Prague time (CET)</span></div></div>`;}
function finalBanner(p){const s=stat(p,p.final);
  return `<div class="banner win"><b>It's decided: ${esc(slotLabel(p,p.final))}</b><p class="small">${s.y.length} yes, ${s.m.length} if need be.</p>
      <div><a href="${gcalLink(p)}" target="_blank" rel="noopener">Add to Google Calendar</a></div></div>`;}
/* what an invitee sees; the organiser gets it under “My vote”, and read-only under “Preview as…” */
function renderVoter(p){
  const v=me(), invited=p.invitees.includes(v), org=viewerIsOrg(), ro=previewing()?" disabled":"";
  if(!draft||draft.pollId!==p.id||draft.pid!==v){draft={pollId:p.id,pid:v,answers:JSON.parse(JSON.stringify(p.answers[v]||{}))};fills={}}
  let h="";
  if(p.status==="draft"&&!org)h+=`<div class="banner warn"><b>Preview</b><p class="small">This poll hasn't been sent yet. ${esc(nameOf(S.organizer))} is checking it.</p></div>`;
  h+=pollInfo(p,true);
  if(LIVE)h+=nextBanner(p);
  if(p.closed&&p.final)h+=finalBanner(p);
  if(p.mode==="list"&&invited&&!p.submitted[v])h+=`<div class="banner info"><b>Round 2: only ${p.slots.length} options left.</b><p class="small">Your answers from round 1 are filled in. Check them and save, even if nothing changed.</p></div>`;
  if(p.flexRound&&!p.closed&&invited&&!org)h+=`<div class="banner info"><b>${esc(nameOf(S.organizer))} is asking for a bit of flexibility.</b><p class="small">Below are the dates where your answer decides the most.</p></div>`;

    if(ns.length){h+=`<div class="card" style="border:2px solid var(--accent)"><span class="eyebrow">Your answer can make the difference</span>`;
      ns.forEach(n=>{const why=n.top?`It would become the best option for the group.`:n.unlock?`Everyone who must attend could then come.`:`You're the only "No" among everyone who answered.`;
        h+=`<div class="ritem"><div class="rhead"><span class="rname">${esc(slotLabel(p,n.sid))}</span><span class="tag">${n.after} could come</span></div>
          <p class="small">${why} Could it work for you after all?</p>
          <div class="row"><button class="btn small primary" data-act="flex" data-sid="${n.sid}"${ro}>I can make it work</button><button class="btn small" data-act="dismiss" data-sid="${n.sid}"${ro}>I really can't</button></div></div>`;});
      h+=`</div>`;}}
  if(invited&&!p.closed)h+=renderEditor(p);

  h+=renderRanking(p);

}
function renderSendPanel(p){const list=sortedInvitees(p).filter(x=>x!==S.organizer);const noMail=list.filter(x=>!okMail((S.people[x]||{}).email));
  return `<div class="card" style="gap:8px"><h3>Send to ${list.length} people</h3>
    ${noMail.length?`<p class="small" style="color:var(--no)">No e-mail for ${noMail.map(x=>esc(nameOf(x))).join(", ")}. They won't get an e-mail; copy their personal link from “Organiser tools” and send it yourself, or add the address in “Edit setup”.</p>`:""}
    <div class="people">${list.map(x=>`<div class="prow"><span>${esc(nameOf(x))} ${roleTag(p,x)}</span><span class="small muted">${esc((S.people[x]||{}).email||"no e-mail")}</span></div>`).join("")}</div>
    <p class="small muted">Each person gets an e-mail with their own link. In this prototype nothing is actually e-mailed.</p>
    <div class="row"><button class="btn small" data-act="send-open">Not yet</button><button class="btn small primary" data-act="send">Send ${list.length-noMail.length} e-mails now</button></div></div>`}

function renderEditor(p){
  let h=`<section class="card" aria-labelledby="mine-h"><div class="between"><h2 id="mine-h">Your answers</h2>${p.submitted[me()]?`<span class="tag">Saved</span>`:`<span class="tag">Not saved yet</span>`}</div>`;
  if(p.mode==="list"){h+=`<p class="small muted">Pick one answer for each option.</p>`}
  else{h+=`<div class="hint"><span><b>Tap a ${p.mode==="day"?"date":"box"}</b> to switch: empty → ✓ Yes → ~ If need be → ✕ No → empty. <b>Drag</b> to give more ${p.mode==="day"?"dates":"boxes"} the same answer. <b>Tap a ${p.mode==="day"?"weekday name":"day or hour heading"}</b> to set the whole ${p.mode==="day"?"column":"row or column"} at once.</span></div>`;
    const hl=p.highlight&&p.highlight.length?p.highlight.map(i=>DOW[i]).join(" & "):null;
    const fb=(k,label,undo)=>`<button class="btn small${fills[k]?" toggled":""}" data-act="fill" data-k="${k}" aria-pressed="${!!fills[k]}">${fills[k]?undo:label}</button>`;
    h+=`<div class="row">${hl&&p.mode==="day"?fb("hl",`Mark all ${hl} as Yes`,`Undo: all ${hl} as Yes`):""}${fb("empty",`Mark everything still empty as No`,`Undo: empty marked as No`)}</div>`;}

}
function legend(p){return `<div class="legend"><span><i class="sw" style="background:var(--yes-soft);border:2px solid var(--yes)"></i>Yes</span><span><i class="sw" style="background:var(--maybe-soft);border:2px dashed var(--maybe)"></i>If need be</span><span><i class="sw" style="background:var(--no-soft);border:2px solid var(--no)"></i>No</span>
  <span><i class="sw" style="background:var(--we);border:1px solid var(--line)"></i>Weekend</span><span><i class="sw" style="border-bottom:3px solid var(--no)"></i>Public holiday</span>${p&&p.highlight&&p.highlight.length?`<span><i class="sw" style="box-shadow:inset 0 3px 0 var(--accent);border:1px solid var(--line)"></i>Preferred by ${esc(nameOf(S.organizer))}</span>`:""}</div>`}

function cellHTML(p,sid,label,mode,c,best){
  const ds=sid.slice(0,10);const cls=sid.length===10?dayClass(ds,p):"";const ttl=sid.length===10?dayTitle(ds):"";
  if(mode==="mine"){const a=draft.answers[sid]||"";
    return `<button class="cell${cls}" data-cell="${sid}" data-a="${a}"${ttl} aria-label="${esc(slotLabel(p,sid))}${holName(ds)?", "+esc(holName(ds)):""}: ${a?LBL[a]:"no answer"}"><span class="dn">${label}</span><span class="mk">${a?GLY[a]:""}</span></button>`;}
  const s=stat(p,sid,c);const r=counted(p).filter(x=>c.submitted[x]).length||1;const alpha=Math.min(1,s.total/r)*.75;const dark=alpha>.45;
  return `<button class="cell heat${cls}${selCell===sid?" sel":""}" data-pick="${sid}"${ttl} style="background:rgba(var(--heat),${alpha.toFixed(2)});${dark?"color:var(--accent-ink)":""}" aria-label="${esc(slotLabel(p,sid))}: ${s.total} can come${s.reqNo.length?", "+s.reqNo.map(nameOf).join(", ")+" can't":""}">
    ${best===sid?`<span class="star" style="${dark?"color:var(--accent-ink)":""}">★</span>`:""}${(()=>{const f=x=>viewerIsOrg()||role(p,x)==="host";const no=s.reqNo.filter(f),un=s.reqUnknown.filter(f);return no.length?`<span class="dot"></span>`:un.length?`<span class="ring"></span>`:""})()}<span class="small dn">${label}</span><span class="cnt">${s.total}</span></button>`;}

function renderGrid(p,mode){
  const c=mode==="mine"?null:liveCtx(p);const best=mode==="mine"?null:(responded(p).length||c.submitted[me()]?ranking(p,c)[0].id:null);
  if(p.mode==="list"){if(mode!=="mine")return "";return `<div class="stack" style="gap:8px">${p.slots.map(x=>{const a=draft.answers[x.id]||"";
    return `<div class="ritem"><div class="rhead"><span class="rname">${esc(slotLabel(p,x.id))}</span></div><div class="row">${["y","m","n"].map(k=>`<button class="btn small${a===k?" primary":""}" data-act="set-one" data-sid="${x.id}" data-v="${k}" aria-pressed="${a===k}">${GLY[k]} ${LBL[k]}</button>`).join("")}</div></div>`}).join("")}</div>`}
  if(p.mode==="day"){
    const ds=datesOf(p);if(!ds.length)return "";const cand=new Set(ds);let h="";let cur=null;let grid="";
    const head=m=>DOW.map((d,i)=>mode==="mine"?`<button type="button" class="headbtn" data-act="vote-dow" data-v="${i}" data-m="${m}" aria-label="Switch every ${DOWL[i]} in ${MONL[+m.slice(5)-1]}">${d}</button>`:`<div class="dow">${d}</div>`).join("");
    const flush=()=>{if(cur!==null)h+=`<div class="cal" data-grid="${mode}">${head(cur)}${grid}</div>`};
    const startM=ds[0].slice(0,7)+"-01";const endD=D(ds[ds.length-1]);const last=iso(new Date(endD.getFullYear(),endD.getMonth()+1,0));
    for(let s=startM;s<=last;s=addDays(s,1)){const m=s.slice(0,7);if(m!==cur){flush();cur=m;grid="";h+=`<div class="month">${MONL[+s.slice(5,7)-1]} ${s.slice(0,4)}</div>`;for(let i=0;i<dowOf(s);i++)grid+=`<div class="cell off"></div>`}
      grid+=cand.has(s)?cellHTML(p,s,String(+s.slice(8)),mode,c,best):`<div class="cell na${dayClass(s)}" aria-hidden="true"${dayTitle(s)}><span class="dn">${+s.slice(8)}</span></div>`;}
    flush();return h;}
  const ds=datesOf(p).filter(d=>!p.days||p.days.includes(dowOf(d)));const w=winOf(p);const hs=boxStarts(w[0],w[1]);
  let h=`<div class="hgrid" data-grid="${mode}"><div class="exrow"><div></div><div class="exhours">${hs.map(x=>mode==="mine"?`<button type="button" class="headbtn" data-act="vote-col" data-h="${hm(x)}" aria-label="Switch ${hm(x)} on every day">${hm(x)}</button>`:`<div class="hhead">${hm(x)}</div>`).join("")}</div></div>`;
  ds.forEach(d=>{const lab=`${DOW[dowOf(d)]} ${+d.slice(8)} ${MON[+d.slice(5,7)-1]}${holName(d)?" · holiday":""}`;
    h+=`<div class="exrow">`+(mode==="mine"?`<button type="button" class="headbtn" data-act="vote-row" data-d="${d}" aria-label="Switch every hour on ${fmtDay(d)}"${dayTitle(d)}>${lab}</button>`:`<div class="hlabel"${dayTitle(d)}>${lab}</div>`)+`<div class="exhours">`;
    hs.forEach(x=>{const id=`${d}T${hm(x)}`;h+=p.excl&&p.excl[id]?`<div class="cell na" aria-hidden="true"></div>`:cellHTML(p,id,"",mode,c,best)});h+=`</div></div>`});
  return h+`</div>`;
}

function renderGroupCalendar(p){
  if(p.mode==="list")return "";const c=liveCtx(p);const mineLive=c!==undefined&&c.answers!==p.answers&&JSON.stringify(sortObj(draft.answers))!==JSON.stringify(sortObj(p.answers[me()]||{}));
  let h=`<section class="card" aria-labelledby="grp-h"><div class="between"><h2 id="grp-h">How everyone voted</h2><span class="small muted">Number = people who can come · darker = more</span></div>
    ${mineLive?`<p class="small muted">Includes your unsaved changes.</p>`:""}
    <div class="legend"><span>★ best option so far</span>${(()=>{const hosts=p.invitees.filter(x=>role(p,x)==="host").map(nameOf).join(", ");if(!hosts&&!viewerIsOrg())return "";const who=!hosts?"A must-attend person":viewerIsOrg()?`${esc(hosts)} (host) or a must-attend person`:`${esc(hosts)} (host)`;
  return `<span><i class="sw" style="background:var(--no);border-radius:50%;width:9px;height:9px"></i>${who} can't</span><span><i class="sw" style="border:2px solid var(--no);border-radius:50%;width:10px;height:10px"></i>${who} hasn't answered yet</span>`})()}</div>`;
  h+=renderGrid(p,"group");

  return h+`</section>`;
}
function whoBlock(p,sid,c){const s=stat(p,sid,c);
  const org=viewerIsOrg();const list=(arr)=>arr.length?arr.map(x=>{const r=role(p,x);return `${esc(nameOf(x))}${r==="host"||(org&&r!=="reg")?` (${ROLE_LBL[r].toLowerCase()})`:""}`}).join(", "):"nobody";
  return `<div class="who" aria-live="polite"><b>${esc(slotLabel(p,sid))}${holName(sid.slice(0,10))?` · ${esc(holName(sid.slice(0,10)))}`:""}</b>
    <span><span style="color:var(--yes);font-weight:700">✓ Yes (${s.y.length}):</span> ${list(s.y)}</span>
    <span><span style="color:var(--maybe);font-weight:700">~ If need be (${s.m.length}):</span> ${list(s.m)}</span>
    <span><span style="color:var(--no);font-weight:700">✕ No (${s.n.length}):</span> ${list(s.n)}</span>
    <span class="muted">No answer yet (${s.u.length}): ${list(s.u)}</span></div>`;}

function renderRanking(p){
  const c=liveCtx(p);
  if(!counted(p).some(x=>c.submitted[x]))return `<section class="card"><h2>Best options so far</h2><p class="muted">The ranking appears as soon as the first person answers.</p></section>`;

  r.forEach((s,i)=>{const open=!!openRank[s.id];const yc=s.y.filter(x=>role(p,x)!=="opt").length,mc=s.m.filter(x=>role(p,x)!=="opt").length,nc=s.n.filter(x=>role(p,x)!=="opt").length;
    h+=`<div class="ritem${i===0?" top":""}${open?" open":""}"><div class="rhead"><span class="rname">${i+1}. ${esc(slotLabel(p,s.id))}</span>
      <button class="btn small" data-act="toggle-rank" data-sid="${s.id}" aria-expanded="${open}">${open?"Hide":"Who"} <span class="chevron" aria-hidden="true">▾</span></button></div>
      <div class="bar" aria-hidden="true"><i style="width:${yc/n*100}%;background:var(--yes)"></i><i style="width:${mc/n*100}%;background:var(--maybe)"></i><i style="width:${nc/n*100}%;background:var(--no)"></i></div>
      <div class="row small"><span>${s.y.length} yes · ${s.m.length} if need be · ${s.n.length} no · ${s.u.length} no answer</span></div>
      <div class="row small">${viewerIsOrg()?`${s.reqOk?`<span class="tag">Host and must-attend ✓</span>`:s.reqNo.length?`<span class="tag">Can't: ${s.reqNo.map(x=>esc(nameOf(x))).join(", ")}</span>`:`<span class="tag">Waiting for: ${s.reqUnknown.map(x=>esc(nameOf(x))).join(", ")}</span>`}${s.keyAll?`<span class="tag">Key people ${s.keyOk}/${s.keyAll}</span>`:""}${s.optOk?`<span class="tag">+${s.optOk} optional</span>`:""}<span class="tag">Likely about ${estimate(p,s)}</span>`:hostTag(p,s)}</div>
      ${open?whoBlock(p,s.id,c):""}</div>`;});
  return h+`</div></section>`;
}
function renderPeople(p){
  const flexers=p.invitees.filter(x=>p.flex[x]);
  let h=`<section class="card" aria-labelledby="pp-h"><div class="between"><h2 id="pp-h">People</h2><span class="small muted">${responded(p).length} of ${p.invitees.length} answered</span></div>`;
  if(flexers.length){const names=flexers.map(x=>esc(nameOf(x)));const list=names.length>1?names.slice(0,-1).join(", ")+" and "+names[names.length-1]:names[0];
    h+=`<div class="banner win"><b>👏 Thanks for making room, ${list}!</b><p class="small">${names.length>1?`${list} each changed a “No”`:`${list} changed a “No”`} so more of us can meet.</p></div>`;}
  h+=`<div class="people">`;
  const manage=LIVE&&S.viewer===S.organizer&&!previewing()&&orgTab==="results";
  sortedInvitees(p).forEach(x=>{h+=`<div class="prow"><span>${esc(nameOf(x))}${x===me()?" (you)":""} ${manage?"":roleTag(p,x)} ${clapTag(p,x)}</span><span class="row"><span class="tag">${p.submitted[x]?"Answered":"No answer yet"}</span>${manage?liveManage(p,x):""}</span></div>`});
  if(manage)h+=`<p class="small muted">${esc(ROLE_HELP)} “Remove” hides a person and their answers from everyone.</p>`;
  return h+`</div></section>`;
}
function renderOrgTools(p){
  const r=responded(p).length;const top=r?ranking(p):[];const t=top[0];
  let h=`<section class="card" aria-labelledby="org-h"><h2 id="org-h">Organiser tools</h2>`;
  if(!p.closed&&t&&r>=Math.ceil(p.invitees.length/2)&&(!t.reqOk||(t.keyAll&&t.keyOk<t.keyAll))||p.needsRunoff)
    h+=`<div class="banner warn"><b>No date works for everyone who matters yet.</b><p class="small">${t&&!t.reqOk?"Even the best date misses the host or a must-attend person.":"The best date is missing some key people."} A run-off with the top 3 often settles it. ${LIVE?"This round then closes and points everyone to round 2; nobody is e-mailed until you press the button there.":"It opens as a draft, so you can check it before sending."}</p><div><button class="btn small primary" data-act="runoff">Prepare run-off with top 3</button></div></div>`;
  if(!p.closed&&p.status!=="draft"){

}

function addPerson(name,email,force){const st=S.setup;name=(name||"").trim();email=(email||"").trim();if(!name&&!email)return{s:"empty"};

  if(!name&&email)name=email.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
  if(!force&&norm(name)===norm(nameOf(S.organizer)))return{s:"organiser",name};
  const exact=st.people.find(p=>norm(p.name)===norm(name));if(exact){flashNames.add(exact.name);if(email&&!exact.email)exact.email=email;return{s:"exists",name:exact.name}}

    S.bookings.filter(x=>x.date===d).forEach(x=>busy.push([toMin(x.time)-b.buffer,toMin(x.time)+b.duration+b.buffer]));

  try{const r=await api({action:"join",poll:id,name,email,consent:true});LV.busy=false;
    if(!r.ok){bad(liveErr(r.error));return}
    if(r.status==="link_sent"){LV.msg={kind:"info",title:"This e-mail is already in the poll.",text:r.mailed===false?"We couldn't send the e-mail right now. The organiser has been told; try again later.":"We've sent your personal link to it. Open it from your mailbox to change your answers here."};render();return}
    LS.tokens[id]=r.token;lsSave();LV.msg=null;delete S.polls[id];
    const g=await api({action:"get",poll:id,token:r.token});if(g.ok)applyPoll(g);render();window.scrollTo(0,0);
    toast(r.mailed===false?"You're in. We couldn't e-mail your link right now; this device remembers you.":"You're in. We've e-mailed you your personal link.");}
  catch(e){LV.busy=false;bad(liveErr("offline"))}}
async function persist(p,pid){if(!LIVE)return;const id=p.id;
  try{const r=await api({action:"save",poll:id,token:LS.tokens[id]||"",answers:p.answers[pid]||{},dismissed:p.dismissed[pid]||{},flex:p.flex[pid]||0});
    if(!r.ok){toast(liveErr(r.error)+" Your last change wasn't saved.");delete S.polls[id];await liveRefresh0(id);return}
    applyPoll({poll:{...p},people:r.people,me:LV.me[id]});render();}
  catch(e){toast(liveErr("offline")+" Your last change wasn't saved.")}}
async function liveRefresh0(id){try{const r=await api({action:"get",poll:id,token:LS.tokens[id]||""});if(r.ok)applyPoll(r)}catch(e){}render()}
async function liveAdmin(body,okMsg){try{const r=await api({...body,key:LS.admin});if(!r.ok){toast(liveErr(r.error));return null}
    if(r.poll&&r.people)applyPoll({poll:r.poll,people:r.people,me:LV.me[r.poll.id]});else if(r.people){const p=curPoll();applyPoll({poll:{...p},people:r.people,me:LV.me[p.id]})}
    render();if(okMsg)toast(okMsg);return r}catch(e){toast(liveErr("offline"));return null}}
function liveUpdate(p,fields,okMsg){window.scrollTo(0,0);return liveAdmin({action:"admin.update",poll:p.id,fields},okMsg)}
function liveSetupBody(){const st=S.setup;return{org:(st.org||"").trim(),title:st.title.trim(),note:st.note.trim(),map:st.map.trim(),mode:st.mode,dates:st.dates.slice().sort(),
  win:st.mode==="hour"?[mins(st.h1),mins(st.h2)]:null,excl:st.mode==="hour"?{...st.excl}:{},highlight:st.highlight.slice(),deadline:st.deadline||addDays(TODAY,7),autoClose:st.autoClose}}
async function liveCreate(){const st=S.setup;LV.busy=true;render();const body=liveSetupBody();
  const r=st.editingId?await liveAdmin({action:"admin.update",poll:st.editingId,fields:{setup:body}}):await liveAdmin({action:"admin.create",poll:body});LV.busy=false;
  if(!r){render();return}
  const id=r.poll.id;if(!r.people)applyPoll({poll:r.poll,people:[],me:null});
  S.setup=newSetup();save();resetTabs();S.route={v:"poll",id};draft=null;render();window.scrollTo(0,0);
  toast(st.editingId?"Changes saved.":"Poll created. Copy the link below and send it to the team.");}
function liveLink(p){return location.origin+location.pathname+"?p="+encodeURIComponent(p.id)}
function liveShareBox(p){if(p.next)return nextBanner(p);return `<div class="stack" style="gap:6px"><span class="eyebrow">Link for the team</span><div class="linkbox"><code id="lk-share">${esc(liveLink(p))}</code><button class="btn small" data-act="copy" data-target="lk-share">Copy</button></div>
  <p class="small muted">Send it by e-mail or chat. Each person joins with their name and e-mail and can change only their own answers.</p>
  ${p.parent?`<div class="row"><button class="btn small primary" data-act="live-notify">E-mail everyone their round-2 link</button></div><p class="small muted">Sends each person from round 1 their own link. Their answers from round 1 are filled in; they check them and save.</p>`:""}</div>`}
function liveManage(p,x){return `<label class="sr" for="rl-${x}">Role of ${esc(nameOf(x))}</label><select id="rl-${x}" data-act="live-role" data-pid="${x}" style="width:auto;min-height:36px">${ROLES.map(([v,l])=>`<option value="${v}" ${role(p,x)===v?"selected":""}>${l}</option>`).join("")}</select><button class="btn small" data-act="live-hide" data-pid="${x}">Remove</button>`}
function liveAction(a,t,p){
  if(a==="live-retry"){LV.err="";liveLoad()}
  else if(a==="live-hide"){if(confirm(`Remove ${nameOf(t.dataset.pid)} from this poll? Their answers stop counting and nobody sees them.`))liveAdmin({action:"admin.person",poll:p.id,pid:t.dataset.pid,hidden:true},"Removed.")}
  else if(a==="live-join-me"){LV.msg=null;render()}
  else if(a==="live-notify"){if(confirm(`E-mail everyone in “${p.title}” their personal link?`))liveAdmin({action:"admin.notify",poll:p.id},null).then(r=>{if(r)toast(r.failed?`Sent ${r.sent} e-mails, ${r.failed} failed. Details are in the Log sheet.`:`Sent ${r.sent} e-mails.`)})}}
async function liveRunoff(p){const top=ranking(p).slice(0,3).map(s=>s.id);if(top.length<2){toast("A run-off needs at least two options with answers.");return}
  if(!confirm(`Start round 2 with the top ${top.length}: ${top.map(x=>slotLabel(p,x)).join(", ")}? This round closes and points everyone to round 2.`))return;
  const r=await liveAdmin({action:"admin.runoff",poll:p.id,slots:top},null);if(!r)return;
  applyPoll({poll:r.poll,people:r.people,me:null});await liveRefresh0(p.id);
  const g=await liveGet(r.poll.id);if(g.ok)applyPoll(g);
  resetTabs();S.route={v:"poll",id:r.poll.id};draft=null;render();window.scrollTo(0,0);
  toast("Round 2 is ready. Copy the link or e-mail everyone their personal link.");}
function nextBanner(p){if(!p.next)return "";const q=S.polls[p.next];
  return `<div class="banner info"><b>Voting continues in round 2${q?`: only ${(q.slots||[]).length} options left`:""}.</b><div><a href="${esc(location.pathname+"?p="+encodeURIComponent(p.next))}">Open round 2</a></div></div>`}
function liveFooter(){return `<footer class="small" style="margin-top:32px;padding-top:12px;border-top:1px solid var(--line)"><a href="privacy.html" style="color:var(--muted)">Privacy</a></footer>`}

render();
})();
</script>
</body></html>
