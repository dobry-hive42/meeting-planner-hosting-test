    if(only||unlock||top)out.push({sid,only,unlock,top,after:s1.total,score:(top?4:0)+(unlock?2:0)+(only?1:0)});});
  return out.sort((a,b)=>b.score-a.score||b.after-a.after);}

let MCP=null;const GC={state:"idle",cals:[],events:{},loading:{},err:""};const GM={state:"idle",q:"",results:[],err:""};

function mcpMsg(e,server){const c=e&&e.code;
  if(c==="server_not_connected"||c==="selection_required")return `${server} isn't connected. Add it in claude.ai Settings → Connectors, then try again.`;
  if(c==="needs_reauth")return `${server} needs reconnecting in claude.ai Settings → Connectors.`;
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return `This page needs your OK to read ${server}. Tap the button again and allow it.`;
  if(c==="blocked_by_policy")return `Your organisation doesn't allow this page to use ${server}.`;
  return `Couldn't reach ${server} just now${c?` (${c})`:""}. Try again in a moment.`;}
async function callRead(server,tool,input){try{return(await MCP.callTool(server,tool,input,{cache:{staleTime:300000,gcTime:900000}})).payload}
  catch(e){if(e&&e.retryable){await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*400));return(await MCP.callTool(server,tool,input)).payload}throw e}}
async function gcalConnect(){if(!MCP)return;GC.state="loading";GC.err="";render();
  try{const pl=await callRead("Google Calendar","list_calendars",{pageSize:100});GC.cals=(pl&&pl.calendars||[]).map(c=>({id:c.id,name:c.summary||c.id,holiday:/holiday@group\.v\.calendar/.test(c.id)}));
    if(!S.gcalShow){S.gcalShow={};GC.cals.forEach(c=>{S.gcalShow[c.id]=!c.holiday&&!/@group\.calendar\.google\.com$/.test(c.id)});save()}
    GC.state="ready";render();gcalLoadMonth(S.setup.month);}
  catch(e){GC.state="error";GC.err=mcpMsg(e,"Google Calendar");render()}}
async function gcalLoadMonth(month){if(GC.state!=="ready")return;const[y,m]=month.split("-").map(Number);const end=iso(new Date(y,m,1));
  const ids=GC.cals.filter(c=>S.gcalShow[c.id]).map(c=>c.id);
  for(const id of ids){const k=month+"|"+id;if(GC.events[k]||GC.loading[k])continue;GC.loading[k]=true;
    try{let list=[],tok;for(let i=0;i<3;i++){const pl=await callRead("Google Calendar","list_events",{calendarId:id,startTime:`${month}-01T00:00:00`,endTime:`${end}T00:00:00`,pageSize:250,orderBy:"startTime",...(tok?{pageToken:tok}:{})});
        list=list.concat((pl&&pl.events)||[]);tok=pl&&pl.nextPageToken;if(!tok)break}
      GC.events[k]=list.filter(e=>e.status!=="cancelled").map(e=>({title:e.summary||"Busy",allDay:!!(e.start&&e.start.date),start:(e.start&&(e.start.dateTime||e.start.date))||"",end:(e.end&&(e.end.dateTime||e.end.date))||""}));}
    catch(e){GC.err=mcpMsg(e,"Google Calendar")}GC.loading[k]=false;render();}}
function gcalDay(s){if(GC.state!=="ready")return[];const out=[];GC.cals.forEach(c=>{if(!S.gcalShow[c.id])return;(GC.events[s.slice(0,7)+"|"+c.id]||[]).forEach(e=>{
    if(e.allDay){if(e.start<=s&&s<e.end)out.push({...e,cal:c.name})}else if(e.start.slice(0,10)===s)out.push({...e,cal:c.name})})});
  return out.sort((a,b)=>(b.allDay-a.allDay)||(a.start<b.start?-1:1));}
async function gmailSearch(q){if(!MCP||!q)return;GM.state="loading";GM.q=q;GM.err="";render();
  try{const pl=await callRead("Gmail","search_threads",{query:`{from:"${q.replace(/"/g,"")}" to:"${q.replace(/"/g,"")}" cc:"${q.replace(/"/g,"")}"}`,pageSize:30,view:"THREAD_VIEW_METADATA_ONLY"});
    const seen={};(pl&&pl.threads||[]).forEach(t=>(t.messages||[]).forEach(m=>(m.addressDisplayNames||[]).forEach(a=>{const em=(a.emailAddress||"").toLowerCase();if(!em||seen[em])return;
      const nm=a.displayName||"";if(norm(nm).includes(norm(q))||norm(em).includes(norm(q)))seen[em]={name:nm||em.split("@")[0],email:em}})));
    GM.results=Object.values(seen).slice(0,8);GM.state="ready";}

function renderGrid(p,mode){

  if(p.mode==="list"){if(mode!=="mine")return "";return `<div class="stack" style="gap:8px">${p.slots.map(x=>{const a=draft.answers[x.id]||"";

  if(p.mode==="day"){
    const ds=datesOf(p);if(!ds.length)return "";const cand=new Set(ds);let h="";let cur=null;let grid="";
    const head=m=>DOW.map((d,i)=>mode==="mine"?`<button type="button" class="headbtn" data-act="vote-dow" data-v="${i}" data-m="${m}" aria-label="${esc(T("grid.switchDow",{dow:DOWL[i],month:MONL[+m.slice(5)-1]}))}">${d}</button>`:`<div class="dow">${d}</div>`).join("");
    const flush=()=>{if(cur!==null)h+=`<div class="cal" data-grid="${mode}">${head(cur)}${grid}</div>`};
    const startM=ds[0].slice(0,7)+"-01";const endD=D(ds[ds.length-1]);const last=iso(new Date(endD.getFullYear(),endD.getMonth()+1,0));
    for(let s=startM;s<=last;s=addDays(s,1)){const m=s.slice(0,7);if(m!==cur){flush();cur=m;grid="";h+=`<div class="month">${MONL[+s.slice(5,7)-1]} ${s.slice(0,4)}</div>`;for(let i=0;i<dowOf(s);i++)grid+=`<div class="cell off"></div>`}
      grid+=cand.has(s)?cellHTML(p,s,String(+s.slice(8)),mode,c,best):`<div class="cell na${dayClass(s)}" aria-hidden="true"${dayTitle(s)}><span class="dn">${+s.slice(8)}</span></div>`;}
    flush();return h;}
  const ds=datesOf(p).filter(d=>!p.days||p.days.includes(dowOf(d)));const w=winOf(p);const hs=boxStarts(w[0],w[1]);
  let h=`<div class="hgrid" data-grid="${mode}"><div class="exrow"><div></div><div class="exhours">${hs.map(x=>mode==="mine"?`<button type="button" class="headbtn" data-act="vote-col" data-h="${hm(x)}" aria-label="${esc(T("grid.switchCol",{h:hm(x)}))}">${hm(x)}</button>`:`<div class="hhead">${hm(x)}</div>`).join("")}</div></div>`;
  ds.forEach(d=>{const lab=`${fmtDay(d)}${holName(d)?" · "+T("grid.holiday"):""}`;
    h+=`<div class="exrow">`+(mode==="mine"?`<button type="button" class="headbtn" data-act="vote-row" data-d="${d}" aria-label="${esc(T("grid.switchRow",{day:fmtDay(d)}))}"${dayTitle(d)}>${lab}</button>`:`<div class="hlabel"${dayTitle(d)}>${lab}</div>`)+`<div class="exhours">`;
    hs.forEach(x=>{const id=`${d}T${hm(x)}`;h+=p.excl&&p.excl[id]?`<div class="cell na" aria-hidden="true"></div>`:cellHTML(p,id,"",mode,c,best)});h+=`</div></div>`});
  return h+`</div>`;
}

function addPerson(name,email,force){const st=S.setup;name=(name||"").trim();email=(email||"").trim();if(!name&&!email)return{s:"empty"};

  if(!force&&norm(name)===norm(nameOf(S.organizer)))return{s:"organiser",name};

  if(!force){const known=S.contacts.find(c=>norm(c.name)===norm(name));
    if(known){email=email||known.email}

      const lim=norm(name).length<=6?1:2;

  return{s:"added",name};}

const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};const toHM=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
function bookingSlots(){const b=S.booking;const out=[];
  for(let d=b.start;d<=b.end;d=addDays(d,1)){if(!b.days.includes(dowOf(d)))continue;
    const busy=[];b.calendars.filter(c=>c.check).forEach(c=>busyFor(c.id,d).forEach(x=>busy.push([toMin(x[0])-b.buffer,toMin(x[1])+b.buffer])));
    S.bookings.filter(x=>x.date===d).forEach(x=>busy.push([toMin(x.time)-b.buffer,toMin(x.time)+b.duration+b.buffer]));
    const step=b.duration<=15?15:30;
    const day=[];for(let m=toMin(b.from);m+b.duration<=toMin(b.to);m+=step){
      const clash=busy.some(([s,e])=>m<e&&m+b.duration>s);const key=`${d} ${toHM(m)}`;
      day.push({key,date:d,time:toHM(m),busy:clash,removed:!!b.removed[key],taken:S.bookings.some(x=>x.key===key)});}
    b.extra.filter(x=>x.date===d).forEach(x=>{if(!day.some(y=>y.time===x.time))day.push({key:`${d} ${x.time}`,date:d,time:x.time,extra:true,busy:false,removed:!!b.removed[`${d} ${x.time}`],taken:S.bookings.some(y=>y.key===`${d} ${x.time}`)})});
    day.sort((a,c)=>a.time<c.time?-1:1);out.push({date:d,slots:day});}
  return out;}

const sortObj=o=>Object.keys(o).sort().reduce((a,k)=>(o[k]&&(a[k]=o[k]),a),{});
function draftChanged(){const p=curPoll();const v=me();if(!p||previewing()||!draft||draft.pollId!==p.id||draft.pid!==v||!p.invitees.includes(v)||p.closed)return false;
  if(p.mode==="list"&&!p.submitted[v])return true;
  return JSON.stringify(sortObj(draft.answers))!==JSON.stringify(sortObj(p.answers[v]||{}))||!p.submitted[v]&&Object.keys(draft.answers).length>0}
function renderSaveBar(){let el=document.getElementById("savebar");const show=S.viewer!=="guest"&&S.route.v==="poll"&&draftChanged();
  if(!show){if(el)el.remove();document.documentElement.style.removeProperty("--savebar-h");return}
  const p=curPoll();const mine=p.answers[S.viewer]||{};let changes=0;new Set([...Object.keys(draft.answers),...Object.keys(mine)]).forEach(k=>{if((draft.answers[k]||"")!==(mine[k]||""))changes++});
  const all=slotIds(p).length,done=Object.values(draft.answers).filter(Boolean).length;
  if(!el){el=document.createElement("div");el.id="savebar";el.className="savebar";document.body.appendChild(el)}
  el.innerHTML=`<div class="in"><span class="small">${changes?tn("bar.changes",changes):T("bar.ready")} · ${T("info.answered",{n:done,total:all})}</span><span class="row"><button class="btn small" data-act="discard">${T("bar.undo")}</button><button class="btn small primary" data-act="save">${T("bar.save")}</button></span></div>`;

function toast(t){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}

function applause(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<7;i++){const c=document.createElement("span");c.className="clap";c.textContent="👏";c.style.left=(20+Math.random()*60)+"vw";c.style.top=(55+Math.random()*25)+"vh";c.style.animationDelay=(i*.08)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2000)}}
function commit(p,pid,newAns){
  const old=p.answers[pid]||{};const wasSub=!!p.submitted[pid];
  const flexed=wasSub?Object.keys(newAns).filter(k=>old[k]==="n"&&(newAns[k]==="y"||newAns[k]==="m")):[];
  p.answers[pid]=JSON.parse(JSON.stringify(newAns));p.submitted[pid]=true;
  if(flexed.length){p.flex[pid]=(p.flex[pid]||0)+flexed.length;const best=flexed.map(k=>({k,s:stat(p,k)})).sort((a,b)=>b.s.total-a.s.total)[0];
    save();persist(p,pid,`👏 ${T("toast.flex",{slot:slotLabel(p,best.k),n:best.s.total})}`);draft=null;render();applause();}
  else{save();persist(p,pid,wasSub?T("toast.savedAgain"):T("toast.savedFirst"));draft=null;render();}
}
function startRunoff(p){

    submitted:{},dismissed:{},flex:{},parent:p.id,deadline:addDays(TODAY,5)};

function setCell(sid,v){if(!draft)return;const nv=v||"";if(nv)draft.answers[sid]=nv;else delete draft.answers[sid];

function cycleGroup(ids){if(!ids.length)return;const nv=NEXT[draft.answers[ids[0]]||""];ids.forEach(s=>setCell(s,nv));fills={};render();}

  const ids=slotIds(p).filter(s=>k==="hl"?p.highlight.includes(dowOf(s.slice(0,10))):!draft.answers[s]);const nv=k==="hl"?"y":"n";const ch=[];

  catch(e){toast(liveErr("offline")+" "+T("live.notSaved"))}}
async function liveRefresh0(id){try{const r=await liveGet(id);if(r.ok){applyPoll(r);cacheKeep(r);cacheSave()}}catch(e){}render()}
async function liveAdmin(body,okMsg){try{const r=await api({...body,...orgAuth()});if(!r.ok){toast(liveErr(r.error));return null}
    if(r.poll&&r.people)applyPoll({poll:r.poll,people:r.people,me:LV.me[r.poll.id]});else if(r.people){const p=curPoll();applyPoll({poll:{...p},people:r.people,me:LV.me[p.id]})}
    render();if(okMsg)toast(okMsg);return r}catch(e){toast(liveErr("offline"));return null}}
function liveUpdate(p,fields,okMsg){window.scrollTo(0,0);return liveAdmin({action:"admin.update",poll:p.id,fields},okMsg)}
function liveSetupBody(){const st=S.setup;return{org:(st.org||"").trim(),title:st.title.trim(),note:st.note.trim(),map:st.map.trim(),mode:st.mode,dates:st.dates.slice().sort(),
  win:st.mode==="hour"?[mins(st.h1),mins(st.h2)]:null,excl:st.mode==="hour"?{...st.excl}:{},highlight:st.highlight.slice(),deadline:st.deadline||addDays(TODAY,7),autoClose:st.autoClose}}
async function liveCreate(){if(LV.busy)return;const st=S.setup;LV.busy=true;render();const body=liveSetupBody();
  const r=st.editingId?await liveAdmin({action:"admin.update",poll:st.editingId,fields:{setup:body}}):await liveAdmin({action:"admin.create",poll:body});LV.busy=false;
  if(!r){render();return}
  const id=r.poll.id;if(!r.people)applyPoll({poll:r.poll,people:[],me:null});
  S.setup=newSetup();save();resetTabs();S.route={v:"poll",id};draft=null;render();window.scrollTo(0,0);
  toast(st.editingId?T("toast.changesSaved"):T("toast.created"));}
function liveLink(p){return location.origin+location.pathname+"?p="+encodeURIComponent(p.id)}
function liveShareBox(p){if(p.next)return nextBanner(p);return `<div class="stack" style="gap:6px"><span class="eyebrow">${T("share.title")}</span><div class="linkbox"><code id="lk-share">${esc(liveLink(p))}</code><button class="btn small" data-act="copy" data-target="lk-share">${T("share.copy")}</button></div>
  <p class="small muted">${T("share.text")}</p>
  ${p.parent?`<div class="row"><button class="btn small primary" data-act="live-notify">${T("share.notify")}</button></div><p class="small muted">${T("share.notifyText")}</p>`:""}</div>`}
function liveManage(p,x){return `<label class="sr" for="rl-${x}">${T("pp.roleOf",{name:esc(nameOf(x))})}</label><select id="rl-${x}" data-act="live-role" data-pid="${x}" style="width:auto;min-height:36px">${ROLES.map(([v,l])=>`<option value="${v}" ${role(p,x)===v?"selected":""}>${l}</option>`).join("")}</select><button class="btn small" data-act="live-hide" data-pid="${x}">${T("pp.remove")}</button>`}
function liveAction(a,t,p){
  if(a==="live-retry"){LV.err="";liveLoad()}
  else if(a==="live-signout")liveSignOut();
  else if(a==="del-poll"){LV.del={id:t.dataset.id,step:1};render()}
  else if(a==="del-step"){if(LV.del)LV.del.step=2;render()}
  else if(a==="del-no"){LV.del=null;render()}
  else if(a==="del-yes"){if(LV.del)liveArchive(LV.del.id,true)}
  else if(a==="restore-poll"){liveArchive(t.dataset.id,false)}
  else if(a==="lang"){setLang(t.dataset.v)}
  else if(a==="live-orgview"){try{sessionStorage.removeItem("mp-voter")}catch(e){}location.reload()}
  else if(a==="live-hide"){if(confirm(T("ask.remove",{name:nameOf(t.dataset.pid)})))liveAdmin({action:"admin.person",poll:p.id,pid:t.dataset.pid,hidden:true},T("toast.removed"))}
  else if(a==="live-join-me"){LV.msg=null;render()}
  else if(a==="live-notify"){if(confirm(T("ask.notify",{title:p.title})))liveAdmin({action:"admin.notify",poll:p.id},null).then(r=>{if(r)toast(r.failed?T("toast.sentFailed",{sent:r.sent,failed:r.failed}):T("toast.sent",{sent:r.sent}))})}}
async function liveRunoff(p){const top=ranking(p).slice(0,3).map(s=>s.id);if(top.length<2){toast(T("toast.runoffNeeds"));return}
  if(!confirm(T("ask.runoff",{n:top.length,slots:top.map(x=>slotLabel(p,x)).join(", ")})))return;
  const r=await liveAdmin({action:"admin.runoff",poll:p.id,slots:top},null);if(!r)return;
  applyPoll({poll:r.poll,people:r.people,me:null});await liveRefresh0(p.id);
  const g=await liveGet(r.poll.id);if(g.ok)applyPoll(g);
  resetTabs();S.route={v:"poll",id:r.poll.id};draft=null;render();window.scrollTo(0,0);
  toast(T("toast.runoffReady"));}
/* a decided poll: who can come on the chosen date first, everything else folded away (Martin, 14. 11. 2026) */
function decidedView(p){return `<section class="card" aria-labelledby="res-h"><h2 id="res-h">${T("res.title")}</h2>${whoBlock(p,p.final,liveCtx(p))}
  <details><summary class="linkbtn" style="display:inline-block">${T("res.more")}</summary><div class="stack" style="margin-top:12px">${renderGroupCalendar(p)}${renderRanking(p)}${renderPeople(p)}</div></details></section>`}
function nextBanner(p){if(!p.next)return "";const q=S.polls[p.next];
  return `<div class="banner info"><b>${q?T("next.titleN",{n:(q.slots||[]).length}):T("next.title")}</b><div><a href="${esc(location.pathname+"?p="+encodeURIComponent(p.next))}">${T("next.open")}</a></div></div>`}
function liveFooter(){return `<footer class="small" style="margin-top:32px;padding-top:12px;border-top:1px solid var(--line)"><a href="${privacyHref()}" style="color:var(--muted)">${T("foot.privacy")}</a></footer>`}
/* přepínač jazyka (Q55): vidět hned na první stránce a na každé další */
function langSwitch(){if(!LIVE)return "";return `<span class="langsw" role="group" aria-label="${esc(T("lang.label"))}">${LANGS.filter(l=>I18N[l]).map(l=>`<button type="button" class="langbtn" data-act="lang" data-v="${l}" lang="${l}" aria-pressed="${l===LANG}">${l.toUpperCase()}</button>`).join("")}</span>`}
function privacyHref(){return LANG==="en"?"privacy.html":`privacy-${LANG}.html`}
function setLang(l){if(!LANGS.includes(l)||!I18N[l])return;LANG=l;try{localStorage.setItem("mp-lang",l)}catch(e){}document.documentElement.lang=l;
  setLangArrays();setRoleLabels();for(const y in HOLCACHE)delete HOLCACHE[y];
  /* keep what was typed: a new language redraws the page (Martin 19. 11.: the join form came back empty) */
  const kept=[...document.querySelectorAll("#app input[id],#app textarea[id],#app select[id]")].map(e=>[e.id,e.type==="checkbox"||e.type==="radio"?e.checked:e.value,e===document.activeElement]);
  render();
  kept.forEach(([id,v,f])=>{const e=document.getElementById(id);if(!e)return;if(e.type==="checkbox"||e.type==="radio")e.checked=v;else e.value=v;if(f)e.focus()});
  liveLangToServer()}
async function liveLangToServer(){if(!LIVE)return;for(const id of Object.keys(LS.tokens||{})){if(!S.polls[id]||!LV.me[id])continue;try{await api({action:"lang",poll:id,token:LS.tokens[id],lang:LANG})}catch(e){}}}

render();
})();
</script>
</body></html>
